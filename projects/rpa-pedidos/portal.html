<!doctype html>
<html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pedidos · Laboratório RPA</title>
<style>
*{box-sizing:border-box}body{font:16px system-ui;margin:0;background:#faf7f5;color:#382d37}main{max-width:780px;margin:50px auto;padding:32px;background:white;border:1px solid #e9dce3;border-radius:18px}small{color:#816779}h1{font-size:34px;letter-spacing:-1px}label{display:block;font-size:13px;margin:18px 0}input{display:block;width:100%;padding:12px;border:1px solid #cabdc7;border-radius:7px;margin-top:7px;font:inherit}button{background:#7d486d;color:white;padding:13px 22px;border:0;border-radius:8px;font:inherit;cursor:pointer}#resultado{padding:18px;background:#f4edf2;min-height:64px;border-radius:8px;white-space:pre-wrap}footer{font-size:12px;color:#816779;margin-top:26px}
</style>
<main><small>PORTFÓLIO · RPA E AUTOMAÇÃO DE PROCESSOS</small><h1>Cadastro de pedidos</h1><p>Sistema fictício para demonstrar leitura de dados, preenchimento e tratamento de exceções.</p>
<form id="cadastro" novalidate><label>Pedido<input name="pedido" placeholder="PED-0001" autocomplete="off"></label><label>Fornecedor<input name="fornecedor" autocomplete="off"></label><label>E-mail<input name="email" autocomplete="off"></label><label>Valor em reais<input name="valor" placeholder="1250,50" autocomplete="off"></label><button type="submit">Cadastrar pedido</button></form>
<h2>Resultado do processamento</h2><pre id="resultado" role="status" data-status="aguardando">Aguardando pedido.</pre><footer>Dados de demonstração. Não há integração com ERP, pagamentos ou empresas reais.</footer></main>
<script>
document.getElementById('cadastro').onsubmit=async event=>{
 event.preventDefault();const form=event.target,button=form.querySelector('button'),result=document.getElementById('resultado');button.disabled=true;result.dataset.status='processando';
 try{const response=await fetch('/api/pedidos',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(form)))});const data=await response.json();result.dataset.status=response.ok?data.status:response.status>=500?'erro_tecnico':'rejeitado';result.textContent=JSON.stringify(data,null,2);}
 catch(e){result.dataset.status='erro_tecnico';result.textContent='Falha de conexão. Pode tentar novamente.';}
 finally{button.disabled=false;}
};
</script></html>
