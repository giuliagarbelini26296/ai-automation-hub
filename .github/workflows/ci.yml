name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read

jobs:
  rpa-pedidos:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/rpa-pedidos
    env:
      PYTHON: python3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run test:e2e

  webhook-llm-triage:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/webhook-llm-triage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --no-cache-dir -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest
